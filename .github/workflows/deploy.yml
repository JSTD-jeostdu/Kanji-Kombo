name: GitHub Pages 배포

# main 브랜치에 코드가 올라갈 때마다 자동으로 빌드해서 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동으로도 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanji-kombo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kanji-kombo/package-lock.json

      - name: 패키지 설치
        run: npm ci

      # 데이터가 깨진 채로 배포되지 않도록 먼저 검사한다
      - name: 데이터셋 검사
        run: npm run validate

      - name: 병합 규칙 검사
        run: npm run test:merge

      - name: 빌드
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # 이 경로는 저장소 최상단 기준이다 (working-directory가 적용되지 않는다)
          path: kanji-kombo/dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
